<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آزمون آنلاین - گروه مشاوره</title>
    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            background-color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 450px;
            width: 100%;
        }
        h2 {
            text-align: center;
            color: #0f172a;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #334155;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #06b6d4;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0891b2;
        }
        #statusMessage {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>پاسخ‌برگ آزمون آنلاین</h2>
    <form id="quizForm">
        <div class="form-group">
            <label for="studentName">نام و نام خانوادگی دانش‌آموز:</label>
            <input type="text" id="studentName" required placeholder="مثلاً: علی رضایی">
        </div>

        <div class="form-group">
            <label for="physicsScore">درصد یا تعداد پاسخ‌های صحیح:</label>
            <input type="text" id="physicsScore" required placeholder="مثلاً: ۷۵٪">
        </div>

        <button type="submit" id="submitBtn">ثبت و ارسال پاسخ‌برگ</button>
    </form>
    <div id="statusMessage"></div>
</div>

<script>
    // لینک وب‌هوک گوگل شیت خود را که در گام اول گرفتید، بین دو کوتیشن زیر قرار دهید:
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyeWbosyV3hAM4Ass37o-Y1LDnxqReELXIXmvK4FrCyZqWVKUolArsyIRPt5O1JO0E1/exec';

    const form = document.getElementById('quizForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusMessage = document.getElementById('statusMessage');

    form.addEventListener('submit', e => {
        e.preventDefault();

        submitBtn.disabled = true;
        submitBtn.innerText = 'در حال ارسال...';
        statusMessage.style.color = '#334155';
        statusMessage.innerText = 'لطفاً چند لحظه صبر کنید...';

        const formData = new FormData();
        formData.append('studentName', document.getElementById('studentName').value);
        formData.append('physicsScore', document.getElementById('physicsScore').value);

        fetch(SCRIPT_URL, { method: 'POST', body: formData })
            .then(response => {
                statusMessage.style.color = '#16a34a';
                statusMessage.innerText = '✅ آزمون با موفقیت ثبت شد!';
                form.reset();
                submitBtn.disabled = false;
                submitBtn.innerText = 'ثبت و ارسال پاسخ‌برگ';
            })
            .catch(error => {
                statusMessage.style.color = '#dc2626';
                statusMessage.innerText = '❌ خطایی رخ داد. مجدداً تلاش کنید.';
                submitBtn.disabled = false;
                submitBtn.innerText = 'ثبت و ارسال پاسخ‌برگ';
            });
    });
</script>

</body>
</html>
