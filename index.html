<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سامانه آزمون هوشمند | گروه مشاوره دکتر خاکسار</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        :root {
            --primary: #0f172a; --accent: #3b82f6; --bg: #f8fafc; --card: #ffffff;
        }
        body { 
            background-color: var(--bg); font-family: Vazirmatn, Tahoma, sans-serif; 
            margin: 0; padding: 20px; display: flex; justify-content: center;
        }
        .container { width: 100%; max-width: 700px; }
        .card { 
            background: var(--card); border-radius: 20px; padding: 35px; 
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08); border: 1px solid #e2e8f0;
        }
        .brand-header { text-align: center; margin-bottom: 30px; }
        .brand-header h1 { color: var(--primary); font-size: 24px; margin: 0; }
        .brand-header p { color: var(--accent); font-weight: bold; margin: 5px 0 0; font-size: 14px; letter-spacing: 1px; }
        
        .exam-info-bar { 
            display: flex; justify-content: space-between; align-items: center;
            background: #f1f5f9; padding: 15px 20px; border-radius: 15px; margin-bottom: 25px;
        }
        .timer-box { background: #fee2e2; color: #ef4444; padding: 10px 18px; border-radius: 12px; font-weight: 800; font-size: 20px; direction: ltr; }
        
        .btn { 
            width: 100%; padding: 16px; background: var(--accent); color: white; border: none; 
            border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .btn:hover { background: var(--primary); transform: translateY(-2px); }
        .btn:disabled { background: #94a3b8; transform: none; }

        .subject-divider {
            background: linear-gradient(90deg, #e0f2fe 0%, #ffffff 100%);
            color: #0369a1; padding: 12px 18px; border-radius: 10px; 
            font-weight: bold; margin: 35px 0 15px; border-right: 6px solid var(--accent);
        }

        /* استایل حباب‌های پاسخ‌برگ */
        .q-row { display: flex; justify-content: space-between; align-items: center; padding: 15px 5px; border-bottom: 1px solid #f1f5f9; }
        .q-num { font-weight: bold; color: #475569; width: 60px; }
        .options { display: flex; gap: 12px; direction: ltr; }
        .option-label { cursor: pointer; }
        .option-label input { display: none; }
        .bubble { 
            width: 42px; height: 42px; border-radius: 50%; border: 2px solid #cbd5e1;
            display: flex; justify-content: center; align-items: center; font-weight: bold; color: #64748b; transition: 0.2s;
        }
        .option-label input:checked + .bubble { background: var(--primary); border-color: var(--primary); color: white; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }

        #step1, #step2, #loading { display: none; }
        .alert { padding: 20px; border-radius: 12px; text-align: center; font-weight: bold; margin-top: 20px; }
        .alert-warning { background: #fffbeb; color: #92400e; border: 1px solid #fef3c7; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="brand-header">
                <p>GROUP MOSHAVEREH</p>
                <h1>دکتر خاکسار - مهندس زیلابی</h1>
            </div>

            <div id="initStatus" style="text-align: center; color: #64748b;">در حال احراز هویت آزمون...</div>

            <div id="examMainArea" style="display: none;">
                <div class="exam-info-bar">
                    <div>
                        <h2 id="examTitle" style="margin: 0; font-size: 18px;">نام آزمون</h2>
                        <span id="consName" style="font-size: 13px; color: #64748b;">مشاور: </span>
                    </div>
                    <div class="timer-box" id="timerDisplay">00:00</div>
                </div>

                <div id="step1">
                    <div style="margin-bottom: 20px;">
                        <label style="display:block; margin-bottom: 8px; font-weight: bold;">نام و نام خانوادگی دانش‌آموز:</label>
                        <input type="text" id="studentName" style="width:100%; padding:15px; border-radius:10px; border:2px solid #e2e8f0; box-sizing:border-box; font-size:16px; text-align:center;" placeholder="مثال: علی رضایی">
                    </div>
                    <div id="timeNotice" class="alert alert-warning" style="display:none; margin-bottom: 20px;"></div>
                    <button class="btn" id="startBtn">شروع جلسه آزمون</button>
                </div>

                <div id="step2">
                    <div id="bubbleSheet"></div>
                    <button class="btn" id="submitBtn" style="background: #10b981; margin-top: 40px;">پایان آزمون و ثبت نهایی</button>
                </div>
            </div>

            <div id="loading" style="text-align:center; padding: 20px;">
                <div style="color: #3b82f6; font-weight: bold;" id="loadingText">در حال ارسال پاسخ‌برگ...</div>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx0ajJTUZ1lCRJ-MNrrTrRJmaHxECTblYPVwdTRpk7nmOygDGCaCYvkG1h4L7FAejCzIA/exec';
        const urlParams = new URLSearchParams(window.location.search);
        const examId = urlParams.get('id');
        let qCount = 0, examTime = 0, timerInterval;

        if (!examId) {
            document.getElementById('initStatus').innerText = '❌ خطای دسترسی: شناسه آزمون یافت نشد.';
        } else {
            fetch(SCRIPT_URL + '?examId=' + examId + '&nocache=' + new Date().getTime())
                .then(res => res.json())
                .then(data => {
                    document.getElementById('initStatus').style.display = 'none';
                    if (data.status === "not_found") {
                        document.getElementById('initStatus').style.display = 'block';
                        document.getElementById('initStatus').innerText = '❌ آزمونی با این مشخصات وجود ندارد.';
                        return;
                    }

                    document.getElementById('examMainArea').style.display = 'block';
                    document.getElementById('examTitle').innerText = data.examName;
                    document.getElementById('consName').innerText = 'مشاور: ' + data.consultantName;
                    qCount = parseInt(data.qCount);
                    examTime = parseInt(data.timeLimit);
                    document.getElementById('timerDisplay').innerText = examTime + ":00";

                    // مدیریت بازه زمانی
                    if (data.status === "upcoming") {
                        document.getElementById('timeNotice').style.display = 'block';
                        document.getElementById('timeNotice').innerText = '⏳ این آزمون هنوز شروع نشده است. زمان شروع: ' + data.startTime;
                        document.getElementById('startBtn').disabled = true;
                    } else if (data.status === "expired") {
                        document.getElementById('timeNotice').style.display = 'block';
                        document.getElementById('timeNotice').innerText = '🚫 مهلت شرکت در این آزمون به پایان رسیده است.';
                        document.getElementById('startBtn').disabled = true;
                    }

                    buildSheet(qCount, data.subjects);
                    document.getElementById('step1').style.display = 'block';
                });
        }

        function buildSheet(total, subStr) {
            const container = document.getElementById('bubbleSheet');
            let qMap = new Array(total + 1).fill("");
            let cleanStr = subStr.replace(/،/g, ',');
            cleanStr.split(",").forEach(p => {
                let s = p.split(":");
                qMap[parseInt(s[1].split("-")[0])] = s[0].trim();
            });

            for(let i = 1; i <= total; i++) {
                if(qMap[i]) container.innerHTML += `<div class="subject-divider">دفترچه درس: ${qMap[i]}</div>`;
                container.innerHTML += `
                    <div class="q-row">
                        <div class="q-num">سوال ${i}</div>
                        <div class="options">
                            ${[1,2,3,4].map(opt => `
                                <label class="option-label">
                                    <input type="radio" name="q${i}" value="${opt}">
                                    <div class="bubble">${opt}</div>
                                </label>
                            `).join('')}
                        </div>
                    </div>`;
            }
        }

        document.getElementById('startBtn').addEventListener('click', () => {
            if(!document.getElementById('studentName').value.trim()) return alert('لطفاً نام خود را وارد کنید');
            document.getElementById('step1').style.display = 'none';
            document.getElementById('step2').style.display = 'block';
            startTimer(examTime * 60);
        });

        function startTimer(sec) {
            const disp = document.getElementById('timerDisplay');
            timerInterval = setInterval(() => {
                let m = Math.floor(sec / 60), s = sec % 60;
                disp.innerText = (m < 10 ? "0"+m : m) + ":" + (s < 10 ? "0"+s : s);
                if (--sec < 0) { clearInterval(timerInterval); submit(); }
            }, 1000);
        }

        document.getElementById('submitBtn').addEventListener('click', () => {
            if(confirm('آیا از اتمام آزمون و ثبت نهایی اطمینان دارید؟')) submit();
        });

        function submit() {
            clearInterval(timerInterval);
            document.getElementById('step2').style.display = 'none';
            document.getElementById('loading').style.display = 'block';
            let ans = "";
            for(let i=1; i<=qCount; i++) {
                let sel = document.querySelector(`input[name="q${i}"]:checked`);
                ans += sel ? sel.value : "0";
            }
            const fd = new FormData();
            fd.append('examId', examId); fd.append('studentName', document.getElementById('studentName').value); fd.append('answers', ans);
            fetch(SCRIPT_URL, { method: 'POST', body: fd })
                .then(() => {
                    document.getElementById('loadingText').style.color = "#10b981";
                    document.getElementById('loadingText').innerText = "✅ پاسخ‌برگ با موفقیت ثبت شد. خسته نباشید!";
                });
        }
    </script>
</body>
</html>
